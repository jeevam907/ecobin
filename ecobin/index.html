<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#06110e">
  <meta name="description" content="EcoBin - Next-Generation 3D Smart Waste Management, Citizen Reporting & Municipal Telemetry Platform">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>EcoBin — Spot the Waste. Report in Seconds. Track Until Clean.</title>

  <!-- Google Fonts: Plus Jakarta Sans (Display) & Inter (Body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <!-- Core EcoBin 3D Design Tokens & Styles -->
  <link rel="stylesheet" href="./src/styles/tokens.css">
  <link rel="stylesheet" href="./src/styles/main.css">
  <link rel="stylesheet" href="./src/styles/components.css">

  <!-- PWA Web App Manifest -->
  <link rel="manifest" href="./manifest.json">

  <!-- Leaflet Maps CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="" defer></script>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2310b981'><path d='M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2'/></svg>">
</head>
<body>
  <!-- Mount Point for EcoBin Single Page Application -->
  <div id="app-root">
    <!-- Initial Loading State / Shimmer Placeholder -->
    <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.5rem; background: #06110e;">
      <div style="width: 4rem; height: 4rem; border-radius: 1.25rem; background: linear-gradient(135deg, #10b981 0%, #84cc16 100%); display: flex; align-items: center; justify-content: center; font-size: 2rem; box-shadow: 0 0 30px rgba(16, 185, 129, 0.6); animation: floatGentle 3s ease-in-out infinite;">
        🌱
      </div>
      <div style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1.5rem; font-weight: 800; color: #ffffff; letter-spacing: -0.02em;">
        Eco<span style="color: #bef264;">Bin</span> 3D
      </div>
      <div style="font-size: 0.85rem; color: #9cb5ab;">
        Loading Smart Waste Management Engine...
      </div>
    </div>
  </div>

  <noscript>
    <div style="padding: 2rem; text-align: center; color: #ffffff; background: #991b1b;">
      EcoBin requires JavaScript to run its interactive 3D waste telemetry engine. Please enable JavaScript in your browser.
    </div>
  </noscript>

  <!-- Application Bootstrap (Universal Self-Contained Engine for file:/// and http://) -->
  <script src="./src/bundle.js"></script>
</body>
</html>
